# Generated by ClashGate (clashgate). Do not edit by hand; regenerated on install/update.
# Dynamic blocks (controller, proxy-providers, proxies, listeners, routing) are rendered from state files in /etc/clashgate.
global-ua: clash.meta
mode: rule
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: "off"

# GEOIP / GEOSITE / IP-ASN 规则的数据文件（geoip.metadb、GeoSite.dat、ASN.mmdb）在安装和更新时预先下载到内核目录
geodata-mode: false
geo-auto-update: true
geo-update-interval: 48
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

external-controller-tls: "0.0.0.0:25184"
tls:
  certificate: /etc/clashgate/certs/fullchain.pem
  private-key: /etc/clashgate/certs/privkey.pem
external-controller-cors:
  allow-origins:
    - '*'
  allow-private-network: true
secret: "test-secret"
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip"

profile:
  store-selected: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
      # QUIC 载荷嗅探不可靠，改写目标容易把 UDP/443 送到错误地址
      override-destination: false

dns:
  enable: true
  # 域名只解析 IPv4。很多 VPS 没有可用的 IPv6 出口，返回 AAAA 会让连接先去撞不通的地址。
  # 全局 ipv6 仍打开：客户端直接访问 IPv6 地址时，机器有 IPv6 就能出去；GEOIP 也继续匹配 IPv6。
  ipv6: false
  # 服务端用 redir-host。fake-ip 是客户端 / TUN 的做法，这里会把真实目标换成假 IP。
  enhanced-mode: redir-host
  # DNS 直连。respect-rules 会让解析跟着策略组走，中国组默认 REJECT 时解析会被丢掉。
  respect-rules: false
  cache-algorithm: arc
  # 不写 listen：内核不对外开 DNS 端口，只给自己解析。
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  # 节点域名用 IP DNS，不依赖 DoH，避免解析节点时还要先解析 DoH 域名。
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

proxy-providers:
  prov-fixed:
    type: http
    url: "https://example.com/sub.txt"
    path: ./prov-fixed.yaml
    interval: 3600
    proxy: DIRECT
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 5000
      lazy: true

proxies:
  - name: out-fixed
    type: socks5
    server: 9.9.9.9
    port: 1080
    udp: true


proxy-groups:
  - name: "🚀 节点选择"
    type: select
    include-all: true
    proxies:
      - DIRECT
  - name: "🐟 漏网之鱼"
    type: select
    include-all: true
    proxies:
      - "🚀 节点选择"
      - DIRECT

rules:
  - "DOMAIN,api64.ipify.org,DIRECT"
  - "GEOIP,private,DIRECT,no-resolve"
  - "MATCH,🐟 漏网之鱼"

listeners:
  - name: VlessReality
    type: vless
    udp: true
    port: 28443
    listen: 0.0.0.0
    users:
      - username: user
        uuid: 11111111-1111-4111-8111-111111111111
        flow: xtls-rprx-vision
    decryption: mlkem768x25519plus.native.600s.fixed-dec
    reality-config:
      dest: www.microsoft.com:443
      private-key: YQdE8o0kC6k0m0s0kC6k0m0s0kC6k0m0s0kC6k0m0s0
      short-id:
        - 01234567
      server-names:
        - www.microsoft.com
  - {"name": "ss-fixed", "type": "shadowsocks", "port": 30101, "listen": "0.0.0.0", "password": "fixed-secret", "cipher": "chacha20-ietf-poly1305", "udp": true}
