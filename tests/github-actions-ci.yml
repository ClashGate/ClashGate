# GitHub Actions workflow for ClashGate. To enable CI, copy this file to .github/workflows/ci.yml
# (pushing workflow files needs a token with the `workflow` scope).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run tests
        run: tests/run.sh
