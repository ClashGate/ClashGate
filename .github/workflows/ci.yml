# GitHub Actions workflow for ClashGate: tests/run.sh on every push and pull request.
# Actions pinned to majors that run on Node 24 (checkout v7, setup-node v7).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run tests
        run: tests/run.sh
